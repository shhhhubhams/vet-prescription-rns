<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUVAS - Post-Operative Prescription</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #e2e8f0;
      margin: 0;
      padding: 12px;
      color: #0f172a;
    }
    .sheet {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border: 1px solid #cbd5e1;
    }
    .clinic-header {
      text-align: center;
      border-bottom: 2px solid #0284c7;
      padding-bottom: 10px;
      margin-bottom: 14px;
    }
    .clinic-header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #0369a1;
      margin: 0 0 4px 0;
      line-height: 1.3;
    }
    .clinic-header h2 {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin: 0;
      letter-spacing: 0.5px;
    }
    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 14px;
    }
    .info-table td {
      padding: 5px 8px;
      border: 1px solid #e2e8f0;
    }
    .info-table .lbl {
      background: #f8fafc;
      font-weight: 600;
      color: #334155;
      width: 18%;
    }
    .info-table .val { color: #0f172a; }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #0369a1;
      margin: 14px 0 6px 0;
      border-bottom: 1px solid #bae6fd;
      padding-bottom: 4px;
    }
    .med-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
      margin-top: 4px;
    }
    .med-table th, .med-table td {
      border: 1px solid #cbd5e1;
      padding: 6px 8px;
      text-align: left;
    }
    .med-table th {
      background: #0284c7;
      color: #ffffff;
      font-weight: 600;
    }
    .med-table tr:nth-child(even) { background: #f8fafc; }
    .instructions-list {
      font-size: 11.5px;
      line-height: 1.6;
      margin: 0;
      padding-left: 20px;
      color: #1e293b;
    }
    .instructions-list li { margin-bottom: 4px; }
    .highlight-date {
      font-weight: 600;
      color: #0369a1;
      background: #e0f2fe;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .revisit-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 10px;
      font-size: 12px;
    }
    .revisit-dates {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .footer-section {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px dashed #cbd5e1;
      font-size: 11.5px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .btn {
      display: block;
      width: 100%;
      background: #0284c7;
      color: #fff;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      margin-top: 18px;
      box-shadow: 0 2px 6px rgba(2, 132, 199, 0.3);
    }
    @media print {
      body { background: #fff; padding: 0; }
      .sheet { box-shadow: none; border: none; padding: 0; max-width: 100%; }
      .btn { display: none; }
    }
  </style>
</head>
<body>
  <div class="sheet">
    <div class="clinic-header">
      <h1>Department of Veterinary Surgery and Radiology, CoVS, LUVAS- Hisar</h1>
      <h2>POST OPERATIVE PRESCRIPTION (Orthopaedics)</h2>
    </div>

    <table class="info-table">
      <tr>
        <td class="lbl">Owner Name:</td>
        <td class="val" id="d-owner">-</td>
        <td class="lbl">Contact No:</td>
        <td class="val" id="d-phone">-</td>
      </tr>
      <tr>
